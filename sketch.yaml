# arduino-cli build profile: pins the ESP32 core and every library used by the firmware.
# Used by build-binary.sh (arduino-cli compile --profile esp32).
# PartitionScheme=custom = "Tools > Partition Scheme > Custom" in the IDE (partitions.csv).
default_profile: esp32
profiles:
  esp32:
    notes: ESP32 (WROOM/WROVER, CYD), custom partitions (partitions.csv)
    fqbn: esp32:esp32:esp32:PartitionScheme=custom
    platforms:
      - platform: esp32:esp32 (3.3.7)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - ArduinoJson (7.4.3)
      - DallasTemperature (4.0.6)
      - EthernetESP32 (1.0.2)
      - LovyanGFX (1.2.19)
      - PubSubClient (2.8)
      - UrlEncode (1.0.1)
